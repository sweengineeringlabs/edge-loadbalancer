[workspace]

[package]
name = "swe-edge-loadbalancer-registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"
authors = ["SWE Engineering Labs"]
repository = "https://github.com/sweengineeringlabs/edge-loadbalancer"
description = "PoolRegistry/TenantRegistry — (handler, tenant) pool and tier lookup subdomain for swe-edge-loadbalancer"
keywords = ["loadbalancer", "registry", "tenant", "pool", "swe"]
categories = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "registry"

[lib]
path = "main/src/lib.rs"

[dependencies]
swe-edge-loadbalancer-autoscale = { path = "../autoscale" }
swe-edge-loadbalancer-tenant = { path = "../tenant" }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
parking_lot = "0.12"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "swe-edge-loadbalancer"
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"
authors = ["SWE Engineering Labs"]
repository = "https://github.com/sweengineeringlabs/edge-loadbalancer"
description = "Shared LB primitives — BackendPool, InstancePool, IngressLoadBalancer, TenantRegistry, PoolRegistry (ADR-011/012/013)"
keywords = ["loadbalancer", "backend", "pool", "http", "swe"]
categories = ["network-programming"]

[package.metadata.struct-engine]
application_type = "lib"
service_type = "backend_pool"

[lib]
path = "main/src/lib.rs"

[dependencies]
swe-edge-loadbalancer-tenant = { path = "tenant" }
swe-edge-loadbalancer-egress = { path = "egress" }
swe-edge-loadbalancer-autoscale = { path = "autoscale" }
swe-edge-loadbalancer-ingress = { path = "ingress" }
swe-edge-loadbalancer-registry = { path = "registry" }
thiserror = "2"

[dev-dependencies]
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.4.2" }
tokio = { version = "1.52", features = ["macros", "rt", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
